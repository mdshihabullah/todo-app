<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tiny Todo</title>
<style>
  :root { --ink:#1c2333; --muted:#7a8299; --card:#ffffff; --bg:#f4f6fb; --line:#e3e7f2; --accent:#4656e1; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width: 560px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
   form.add { display: flex; gap: 8px; }
   input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; }
   input[type=date] { padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; background: #fff; color: var(--muted); }
   select.priority-select { padding: 10px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; background: #fff; color: var(--ink); outline: none; cursor: pointer; }
  button { cursor: pointer; border: none; border-radius: 8px; }
  .add button { background: var(--accent); color: #fff; padding: 10px 16px; font-size: 15px; }
  .stats { display: flex; gap: 16px; color: var(--muted); font-size: 13px; margin: 14px 2px 6px; }
  ul { list-style: none; padding: 0; margin: 8px 0 0; }
  li { border-top: 1px solid var(--line); }
  li:first-child { border-top: none; }
  form.row { display: flex; align-items: center; gap: 8px; padding: 10px 2px; }
  button.tick { background: #eef1fd; color: var(--accent); width: 26px; height: 26px; border-radius: 50%; font-size: 13px; flex-shrink: 0; }
  button.del { background: none; color: var(--muted); font-size: 13px; margin-left: auto; flex-shrink: 0; }
  button.del:hover { color: #d33; }
  .task { font-size: 15px; }
  .badge { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 7px; border-radius: 999px; line-height: 1.4; display: inline-block; }
  .badge-low { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
  .badge-medium { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
  .badge-high { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
  .badge-overdue { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
  li.done .task { color: var(--muted); text-decoration: line-through; }
  li.done .badge { opacity: 0.5; }
  .empty { color: var(--muted); padding: 12px 2px; font-size: 14px; list-style: none; }
</style>
</head>
<body>
  <main class="wrap">
    <h1>Tiny Todo</h1>
    <p class="sub">Three files. One port. You grow it from here.</p>
    <section class="card">
      <form method="post" action="/add" class="add">
        <input type="text" name="task" placeholder="What needs doing?" autofocus autocomplete="off">
        <select name="priority" class="priority-select" title="Priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <input type="date" name="due_date" title="Due date (YYYY-MM-DD)" placeholder="YYYY-MM-DD">
        <button>Add</button>
      </form>
      <div class="stats">
        <span>{{STAT_TOTAL}} total</span>
        <span>{{STAT_OPEN}} open</span>
        <span>{{STAT_DONE}} done</span>
      </div>
      <ul>
        {{TODO_ROWS}}
      </ul>
    </section>
  </main>
</body>
</html>
