<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Todo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* ---- Design tokens (light + dark) ---- */
  :root {
    --font: "Inter", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  [data-theme="light"] {
    --bg: #f3f1ec;          /* warm paper */
    --surface: #fffdfa;
    --surface-2: #f7f4ee;
    --ink: #1e2430;
    --muted: #6d7480;
    --line: #e6e2d8;
    --accent: #4f46e5;
    --accent-ink: #ffffff;
    --accent-soft: #ecebff;
    --warm: #b45309;
    --shadow: 0 1px 2px rgba(30,36,48,.05), 0 8px 24px -12px rgba(30,36,48,.12);
    --low-bg:#e7f3fb; --low:#0369a1; --low-border:#b9e3f7;
    --med-bg:#fdf0d0; --med:#9a5b05; --med-border:#f5dc9b;
    --high-bg:#fde5e5; --high:#b91c1c; --high-border:#f6bcbc;
    --done-filter: saturate(0.6) brightness(0.98);
  }
  [data-theme="dark"] {
    --bg: #131318;
    --surface: #1c1c23;
    --surface-2: #23232b;
    --ink: #ececf1;
    --muted: #98a0ad;
    --line: #2b2b35;
    --accent: #7c7cf0;
    --accent-ink: #14141c;
    --accent-soft: #2a2a3a;
    --warm: #f0a83f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --low-bg:#0f2a3a; --low:#6ec8f0; --low-border:#1f4a63;
    --med-bg:#3a2f12; --med:#f0c562; --med-border:#5c4a1b;
    --high-bg:#3c1a1a; --high:#ff8a8a; --high-border:#5c2b2b;
    --done-filter: saturate(0.5) brightness(0.82);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; font-family: var(--font); background: var(--bg); color: var(--ink);
    line-height: 1.55; -webkit-font-smoothing: antialiased; transition: background .25s;
  }

  /* ---- Layout shell ---- */
  .shell { max-width: 760px; margin: 0 auto; padding: 24px 16px 96px; }
  .header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; margin: 12px 2px 20px;
  }
  .brand { display: flex; flex-direction: column; }
  .brand .kicker {
    font-family: var(--mono); font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--accent); font-weight: 600;
  }
  .brand h1 { font-size: 26px; font-weight: 800; margin: 2px 0 2px; letter-spacing: -0.5px; }
  .brand .sub { color: var(--muted); font-size: 13px; margin: 0; }

  .theme-toggle {
    appearance: none; border: 1px solid var(--line); background: var(--surface);
    color: var(--muted); width: 38px; height: 38px; border-radius: 10px;
    cursor: pointer; font-size: 16px; display: grid; place-items: center;
    transition: color .2s, border-color .2s; flex-shrink: 0;
  }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }

  /* ---- Add zone ---- */
  .zone { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  .zone.add { padding: 16px; }
  .zone.add form { display: flex; gap: 8px; flex-wrap: wrap; }
  .zone.add .task-input {
    flex: 1 1 180px; min-width: 0; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 10px; font-size: 15px; background: var(--surface-2); color: var(--ink);
    font-family: var(--font);
  }
  .zone.add .task-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .zone.add select {
    padding: 12px 10px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 14px; background: var(--surface-2); color: var(--ink); cursor: pointer;
  }
  .zone.add input[type=date] {
    padding: 11px 10px; border: 1px solid var(--line); border-radius: 10px;
    font-size: 14px; background: var(--surface-2); color: var(--ink); font-family: var(--font);
  }
  .btn {
    border: none; border-radius: 10px; padding: 12px 18px; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: var(--font); transition: transform .06s, background .15s;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.06); }

  /* ---- Filter bar ---- */
  .zone.bar { margin-top: 14px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .zone.bar select, .zone.bar .search-wrap input {
    padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px;
    font-size: 14px; background: var(--surface-2); color: var(--ink); font-family: var(--font);
  }
  .zone.bar .search-wrap { position: relative; flex: 1 1 180px; min-width: 0; }
  .zone.bar .search-wrap input { width: 100%; padding-left: 32px; }
  .zone.bar .search-wrap .mag { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--muted); pointer-events: none; }
  .zone.bar .is-active { border-color: var(--accent) !important; }
  .zone.bar .clear { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 13px; }
  .zone.bar .clear:hover { color: var(--warm); }

  .done-toggle { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 13px; color: var(--muted); }
  .switch { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: var(--line); border-radius: 999px; cursor: pointer;
    transition: .2s;
  }
  .slider::before {
    content: ""; position: absolute; height: 14px; width: 14px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .2s;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(16px); }

  /* ---- Stats zone ---- */
  .zone.stats { margin-top: 14px; padding: 18px 20px; display: flex; align-items: center; gap: 20px; }
  .hero-open { display: flex; align-items: baseline; gap: 8px; }
  .hero-open .n { font-family: var(--mono); font-size: 40px; font-weight: 700; line-height: 1; color: var(--ink); }
  .hero-open .label { color: var(--muted); font-size: 13px; }
  .hero-open .label strong { color: var(--accent); }
  .stat-pills { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
  .stat-pill { font-size: 12px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
  .stat-pill b { color: var(--ink); font-weight: 700; }

  /* ---- List zone ---- */
  .zone.list { margin-top: 14px; }
  ul.todos { list-style: none; padding: 6px 16px 16px; margin: 0; }
  li.row { border-bottom: 1px solid var(--line); }
  li.row:last-child { border-bottom: none; }
  li .row { display: flex; align-items: center; gap: 10px; padding: 11px 2px; }
  .tick {
    width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--accent);
    background: transparent; color: var(--accent); cursor: pointer; font-size: 13px;
    flex-shrink: 0; display: grid; place-items: center;
  }
  li.done .tick { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .task { font-size: 15px; min-width: 0; word-break: break-word; }
  li.done .task { color: var(--muted); text-decoration: line-through; filter: var(--done-filter); }
  .badge {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px;
    padding: 3px 8px; border-radius: 999px; border: 1px solid transparent; flex-shrink: 0;
  }
  .badge-low { background: var(--low-bg); color: var(--low); border-color: var(--low-border); }
  .badge-medium { background: var(--med-bg); color: var(--med); border-color: var(--med-border); }
  .badge-high { background: var(--high-bg); color: var(--high); border-color: var(--high-border); }
  .badge-overdue { background: var(--high-bg); color: var(--high); border-color: var(--high-border); }
  .row-actions { margin-left: auto; display: flex; gap: 2px; flex-shrink: 0; }
  .icon-btn {
    border: none; background: none; color: var(--muted); width: 30px; height: 30px;
    border-radius: 8px; cursor: pointer; font-size: 14px; display: grid; place-items: center;
    transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--accent-soft); }
  .icon-btn.edit:hover { color: var(--accent); }
  .icon-btn.del:hover { color: var(--warm); background: var(--high-bg); }

  .empty { color: var(--muted); padding: 22px 2px; font-size: 14px; text-align: center; list-style: none; }

  /* ---- Modal (edit) ---- */
  dialog.modal {
    border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--surface);
    color: var(--ink); width: min(92vw, 420px); box-shadow: var(--shadow);
  }
  dialog.modal::backdrop { background: rgba(10,10,16,.5); backdrop-filter: blur(2px); }
  .modal-inner { padding: 22px; }
  .modal-inner h2 { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
  .modal-inner .hint { color: var(--muted); font-size: 12px; margin: 0 0 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px;
    font-size: 15px; background: var(--surface-2); color: var(--ink); font-family: var(--font);
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .btn-ghost { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }

  /* ---- Toast (delete undo) ---- */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 140%);
    background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px;
    box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px;
    font-size: 14px; transition: transform .25s cubic-bezier(.2,.8,.2,1); z-index: 40;
    max-width: 92vw;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast .toast-undo {
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 8px;
    padding: 8px 14px; font-weight: 600; cursor: pointer; font-family: var(--font);
  }
  .toast .toast-close { background: none; border: none; color: currentColor; cursor: pointer; font-size: 16px; opacity: .7; }

  @media (max-width: 480px) {
    .hero-open .n { font-size: 32px; }
    .zone.stats { flex-wrap: wrap; }
    .stat-pills { margin-left: 0; }
    .done-toggle { margin-left: 0; width: 100%; justify-content: space-between; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="shell">

    <header class="header">
      <div class="brand">
        <span class="kicker">Tiny&nbsp;Todo</span>
        <h1>What's left to do?</h1>
        <p class="sub">Three files. One port. You grow it from here.</p>
      </div>
      <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle dark mode">🌙</button>
    </header>

    <!-- Add zone -->
    <section class="zone add">
      <form method="post" action="/add" id="addForm">
        <input type="text" name="task" class="task-input" placeholder="What needs doing?" autocomplete="off" id="taskInput">
        <select name="priority" title="Priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <input type="date" name="due_date" title="Due date (YYYY-MM-DD)">
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
    </section>

    <!-- Filter bar -->
    <section class="zone bar">
      <div class="search-wrap">
        <span class="mag">⌕</span>
        <input type="text" name="query" id="searchBox" value="{{SEARCH_VALUE}}" class="{{SEARCH_ACTIVE}}" placeholder="Search..." autocomplete="off">
        <button type="button" class="clear" id="clearAll" title="Clear search and filter">✕</button>
      </div>
      <select name="priority" id="filterSelect" title="Filter by priority">
        <option value="">All priorities</option>
        <option value="low"{{SEL_LOW}}>Low</option>
        <option value="medium"{{SEL_MED}}>Medium</option>
        <option value="high"{{SEL_HIGH}}>High</option>
      </select>
      <span class="done-toggle">
        <label for="showDone">Show completed</label>
        <label class="switch"><input type="checkbox" id="showDone" {{SHOW_DONE}}><span class="slider"></span></label>
      </span>
    </section>

    <!-- Stats zone -->
    <section class="zone stats">
      <div class="hero-open">
        <span class="n">{{STAT_OPEN}}</span>
        <span class="label">open · <strong>{{STAT_DONE}}</strong> done of <strong>{{STAT_TOTAL}}</strong></span>
      </div>
      <div class="stat-pills">
        <span class="stat-pill"><b>{{STAT_TOTAL}}</b> total</span>
        <span class="stat-pill"><b>{{STAT_OPEN}}</b> open</span>
        <span class="stat-pill"><b>{{STAT_DONE}}</b> done</span>
      </div>
    </section>

    <!-- List zone -->
    <section class="zone list">
      <ul class="todos">
        {{TODO_ROWS}}
      </ul>
    </section>

  </div>

  <!-- Edit modal -->
  <dialog class="modal" id="editModal">
    <form method="post" action="/edit" id="editForm" class="modal-inner">
      <h2>Edit todo</h2>
      <p class="hint">Only the fields you change are updated.</p>
      <input type="hidden" name="id" id="editId">
      <div class="field">
        <label for="editTask">Task</label>
        <input type="text" name="task" id="editTask" required>
      </div>
      <div class="field">
        <label for="editPriority">Priority</label>
        <select name="priority" id="editPriority">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="field">
        <label for="editDue">Due date</label>
        <input type="date" name="due_date" id="editDue">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelEdit">Cancel</button>
        <button type="submit" class="btn btn-primary">Save changes</button>
      </div>
    </form>
  </dialog>

  <!-- Toast (delete undo) -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastMsg"></span>
    <button class="toast-undo" id="toastUndo">Undo</button>
    <button class="toast-close" id="toastClose" aria-label="Dismiss">✕</button>
  </div>

<script>
(function () {
  "use strict";

  /* ---- Theme (light/dark) ---- */
  var root = document.documentElement;
  var stored = null;
  try { stored = localStorage.getItem("tiny-theme"); } catch (e) {}
  var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  var theme = stored || (prefersDark ? "dark" : "light");
  function applyTheme(t) {
    root.setAttribute("data-theme", t);
    document.getElementById("themeToggle").textContent = t === "dark" ? "☀" : "🌙";
  }
  applyTheme(theme);
  document.getElementById("themeToggle").addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem("tiny-theme", next); } catch (e) {}
  });

  /* ---- Filter + search (AND-compose, persist server-side) ---- */
  var searchBox = document.getElementById("searchBox");
  var filterSelect = document.getElementById("filterSelect");
  var showDone = document.getElementById("showDone");
  var searchTimer = null;

  function submitSearch() {
    var form = document.createElement("form");
    form.method = "POST"; form.action = "/search";
    var q = searchBox.value.trim();
    var i = document.createElement("input");
    i.type = "hidden"; i.name = "query"; i.value = q;
    form.appendChild(i); document.body.appendChild(form); form.submit();
  }
  searchBox.addEventListener("input", function () {
    searchBox.classList.add("is-active");
    clearTimeout(searchTimer);
    searchTimer = setTimeout(submitSearch, 350);
  });

  filterSelect.addEventListener("change", function () {
    var form = document.createElement("form");
    form.method = "POST"; form.action = "/filter";
    var i = document.createElement("input");
    i.type = "hidden"; i.name = "priority"; i.value = filterSelect.value;
    form.appendChild(i); document.body.appendChild(form); form.submit();
  });

  showDone.addEventListener("change", function () {
    var form = document.createElement("form");
    form.method = "POST"; form.action = "/toggle-done";
    var i = document.createElement("input");
    i.type = "hidden"; i.name = "show_done"; i.value = showDone.checked ? "1" : "0";
    form.appendChild(i); document.body.appendChild(form); form.submit();
  });

  document.getElementById("clearAll").addEventListener("click", function () {
    var form = document.createElement("form");
    form.method = "POST"; form.action = "/reset-filters";
    document.body.appendChild(form); form.submit();
  });

  /* Server-side state means the page reload reflects filter/search, so we
     re-assert the persisted values only if a dedicated clear route exists. */

  /* ---- Edit modal ---- */
  var editModal = document.getElementById("editModal");
  var editForm = document.getElementById("editForm");
  document.querySelectorAll("[data-edit]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var row = btn.closest("li");
      var t = JSON.parse(row.getAttribute("data-todo"));
      document.getElementById("editId").value = t.id;
      document.getElementById("editTask").value = t.task;
      document.getElementById("editPriority").value = t.priority;
      document.getElementById("editDue").value = t.due_date;
      editModal.showModal();
    });
  });
  document.getElementById("cancelEdit").addEventListener("click", function () { editModal.close(); });
  editModal.addEventListener("click", function (e) {
    if (e.target === editModal) editModal.close();
  });

  /* ---- Delete with toast-undo ---- */
  var toast = document.getElementById("toast");
  var toastMsg = document.getElementById("toastMsg");
  var lastDeleted = null;
  var toastTimer = null;

  function showToast(msg) {
    toastMsg.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 5000);
  }
  function hideToast() {
    toast.classList.remove("show");
  }
  document.getElementById("toastClose").addEventListener("click", hideToast);

  document.querySelectorAll("[data-delete]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var row = btn.closest("li");
      var t = JSON.parse(row.getAttribute("data-todo"));
      lastDeleted = t;
      var payload = new URLSearchParams({ id: String(t.id) });
      fetch("/delete", { method: "POST", body: payload })
        .then(function () {
          row.remove();
          showToast("Deleted \u201c" + t.task + "\u201d");
        })
        .catch(function () { showToast("Could not delete. Try again."); });
    });
  });

  document.getElementById("toastUndo").addEventListener("click", function () {
    if (!lastDeleted) return;
    hideToast();
    var payload = new URLSearchParams({
      task: lastDeleted.task,
      priority: lastDeleted.priority,
      due_date: lastDeleted.due_date || "",
      done: lastDeleted.done ? "1" : "0"
    });
    fetch("/restore", { method: "POST", body: payload }).then(function () {
      window.location.reload();
    });
  });
})();
</script>
</body>
</html>
